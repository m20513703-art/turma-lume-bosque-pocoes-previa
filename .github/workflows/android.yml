name: Test corrected Bosque app
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download exact APK
        run: |
          mkdir -p release
          curl --fail --location --silent --show-error 'https://share.zapia.com/xl9m88my6dp2q2l7w9exjn' -o release/app.apk
          sha256sum release/app.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test screen and controls
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r release/app.apk
            adb shell am start -n com.turmadalume.bosquecantante/.MainActivity
            sleep 40
            adb shell input tap 510 190
            sleep 3
            adb exec-out screencap -p > release/menu.png
            adb shell input tap 320 205
            sleep 3
            adb exec-out screencap -p > release/antes.png
            adb shell input tap 560 270
            sleep 0.16
            adb exec-out screencap -p > release/pulo.png
            sleep 1
            adb shell input swipe 125 270 125 270 700
            sleep 1
            adb exec-out screencap -p > release/movimento.png
            adb shell pidof com.turmadalume.bosquecantante
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bosque-exact-apk-test
          path: release/
