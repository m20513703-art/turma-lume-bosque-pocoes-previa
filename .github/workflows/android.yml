name: Build Bosque Cantante Android
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download Android project
        run: |
          curl --fail --location --silent --show-error 'https://share.zapia.com/i56it6uhv8ql5zgomvmrqh' -o game.zip
          unzip -q game.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android APK
        working-directory: android-template
        run: gradle --no-daemon assembleRelease
      - name: Validate APK signature and embedded game
        run: |
          APK=android-template/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" | tail -2
          unzip -p "$APK" assets/www/index.html | grep -q 'Fase 1 / 5.000'
          unzip -l "$APK" | grep 'assets/www/assets/logo-bosque-cantante.webp'
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --verbose "$APK"
          mkdir -p release
          cp "$APK" release/Turma-da-Lume-Bosque-Cantante.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and test game on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r release/Turma-da-Lume-Bosque-Cantante.apk
            adb shell am start -n com.turmadalume.bosquecantante/.MainActivity
            sleep 40
            adb shell pidof com.turmadalume.bosquecantante
            adb exec-out screencap -p > release/start.png
            adb shell input tap 320 185
            sleep 4
            adb exec-out screencap -p > release/game.png
            adb shell uiautomator dump /sdcard/game.xml
            adb pull /sdcard/game.xml release/game.xml
            adb shell input swipe 125 260 125 260 900
            sleep 1
            adb exec-out screencap -p > release/moved.png
            adb shell input tap 580 260
            adb exec-out screencap -p > release/jump.png
            adb logcat -d -s chromium:E AndroidRuntime:E > release/log.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bosque-cantante-v3-check
          path: release/
