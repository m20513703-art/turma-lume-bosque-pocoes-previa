name: Build and test Bosque Cantante
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download revised Android project
        run: |
          curl --fail --location --silent --show-error 'https://share.zapia.com/1hobdlr2muoau8263vqwn3' -o game.zip
          unzip -q game.zip
          grep -q 'IMMERSIVE_STICKY' android-template/app/src/main/java/com/turmadalume/bosquecantante/MainActivity.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android APK
        working-directory: android-template
        run: gradle --no-daemon assembleRelease
      - name: Verify package and signature
        run: |
          APK=android-template/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" | tail -2
          unzip -p "$APK" assets/www/index.html | grep -q 'requestJump'
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --verbose "$APK"
          mkdir -p release
          cp "$APK" release/Turma-da-Lume-Bosque-Cantante-controles.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify landscape controls and jump on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r release/Turma-da-Lume-Bosque-Cantante-controles.apk
            adb shell am start -n com.turmadalume.bosquecantante/.MainActivity
            sleep 35
            adb shell pidof com.turmadalume.bosquecantante
            adb exec-out screencap -p > release/inicio.png
            adb shell input tap 320 190
            sleep 3
            adb exec-out screencap -p > release/tela.png
            adb shell input tap 560 270
            sleep 0.18
            adb exec-out screencap -p > release/pulo.png
            sleep 1
            adb shell input swipe 125 270 125 270 700
            sleep 1
            adb exec-out screencap -p > release/movimento.png
            adb logcat -d -s chromium:E AndroidRuntime:E > release/log.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bosque-controles-check-v4
          path: release/
