name: Build Bosque Cantante Android
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download Android project
        run: |
          curl --fail --location --silent --show-error 'https://share.zapia.com/4mbrjoy7gshy85x9u5w0ur' -o game.zip
          unzip -q game.zip
          grep -q 'logo-bosque-cantante.webp' android-template/app/src/main/assets/www/index.html
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android APK
        working-directory: android-template
        run: gradle --no-daemon assembleRelease
      - name: Validate APK signature and embedded game
        run: |
          APK=android-template/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" | tail -2
          unzip -p "$APK" assets/www/index.html | grep -q 'Fase 1 / 5.000'
          unzip -l "$APK" | grep 'assets/www/assets/logo-bosque-cantante.webp'
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --verbose "$APK"
          mkdir -p release
          cp "$APK" release/Turma-da-Lume-Bosque-Cantante.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r release/Turma-da-Lume-Bosque-Cantante.apk
            adb shell am start -n com.turmadalume.bosquecantante/.MainActivity
            sleep 35
            adb shell pidof com.turmadalume.bosquecantante
            adb exec-out screencap -p > release/start.png
            adb shell uiautomator dump /sdcard/start.xml
            adb pull /sdcard/start.xml release/start.xml
            python3 -c "import xml.etree.ElementTree as E,re,subprocess; r=E.parse('release/start.xml'); b=next(n.get('bounds') for n in r.iter('node') if 'Começar aventura' in (n.get('text') or '')); x1,y1,x2,y2=map(int,re.findall(r'\d+',b));subprocess.run(['adb','shell','input','tap',str((x1+x2)//2),str((y1+y2)//2)],check=True)"
            sleep 5
            adb exec-out screencap -p > release/game.png
            adb shell uiautomator dump /sdcard/game.xml
            adb pull /sdcard/game.xml release/game.xml
            grep -q 'PULAR' release/game.xml
            python3 -c "import xml.etree.ElementTree as E,re,subprocess; r=E.parse('release/game.xml'); b=next(n.get('bounds') for n in r.iter('node') if 'Mover para direita' in (n.get('content-desc') or '')); x1,y1,x2,y2=map(int,re.findall(r'\d+',b));x=(x1+x2)//2;y=(y1+y2)//2;subprocess.run(['adb','shell','input','swipe',str(x),str(y),str(x),str(y),'1200'],check=True)"
            sleep 2
            adb exec-out screencap -p > release/moved.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bosque-cantante-check
          path: release/
